name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build-client:
    runs-on: ubuntu-latest
    env:
      working-directory: "./client"
    steps:
      # OriginalCodeVersion=[v2] DigestResolvedVersion=[v2.7.0] Security: Pinned to SHA for supply chain protection. Full SHA is required.
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Setup node 16
        # OriginalCodeVersion=[v1] DigestResolvedVersion=[v1.4.6] Security: Pinned to SHA for supply chain protection. Full SHA is required.
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 16.x
      - run: npm ci
        working-directory: ${{env.working-directory}}
      - run: npm run build
        working-directory: ${{env.working-directory}}
      - run: npm run lint:ci
        working-directory: ${{env.working-directory}}

  publish-gpr-client:
    needs: build-client
    runs-on: ubuntu-latest
    env:
      working-directory: "./client"
    permissions:
      packages: write
      contents: read
    steps:
      # OriginalCodeVersion=[v2] DigestResolvedVersion=[v2.7.0] Security: Pinned to SHA for supply chain protection. Full SHA is required.
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Setup node 16
        # OriginalCodeVersion=[v1] DigestResolvedVersion=[v1.4.6] Security: Pinned to SHA for supply chain protection. Full SHA is required.
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 16.x
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
        working-directory: ${{env.working-directory}}
      - run: npm publish
        working-directory: ${{env.working-directory}}
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

  publish-gpr-server:
    needs: build-client
    runs-on: ubuntu-latest
    env:
      working-directory: "./server"
    permissions:
      packages: write
      contents: read
    steps:
      # OriginalCodeVersion=[v2] DigestResolvedVersion=[v2.7.0] Security: Pinned to SHA for supply chain protection. Full SHA is required.
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Setup node 16
        # OriginalCodeVersion=[v1] DigestResolvedVersion=[v1.4.6] Security: Pinned to SHA for supply chain protection. Full SHA is required.
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
        with:
          node-version: 16.x
          registry-url: https://npm.pkg.github.com/
      - run: npm ci
        working-directory: ${{env.working-directory}}
      - run: npm publish
        working-directory: ${{env.working-directory}}
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
