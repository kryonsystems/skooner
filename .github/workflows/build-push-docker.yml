name: Create and publish a Docker image

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches:
      - 'stable'
      - 'debug'
      - 'master'
    tags:
      - 'v*.*.*'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_ACTOR: ${{ secrets.DOCKERHUB_ACTOR }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        # OriginalCodeVersion=[v2] DigestResolvedVersion=[v2.7.0] Security: Pinned to SHA for supply chain protection. Full SHA is required.
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0

      - name: 'Dockerhub login'
        run: |
          echo $DOCKERHUB_TOKEN | docker login --username $DOCKERHUB_ACTOR --password-stdin
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        # OriginalCodeVersion=[v3] DigestResolvedVersion=[v3.8.0] Security: Pinned to SHA for supply chain protection. Full SHA is required.
        uses: docker/metadata-action@b2391d37b4157fa4aa2e118d643f417910ff3242 # v3.8.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        # OriginalCodeVersion=[v2] DigestResolvedVersion=[v2.10.0] Security: Pinned to SHA for supply chain protection. Full SHA is required.
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a # v2.10.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
